<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator scientific">
        <input type="text" id="result" readonly value="0">
        
        <div class="buttons">
            <!-- Functions Row 1 -->
            <button class="func" data-action="sin">sin</button>
            <button class="func" data-action="cos">cos</button>
            <button class="func" data-action="tan">tan</button>
            <button class="clear" data-action="clear">AC</button>
            <button class="operator" data-action="delete">DEL</button>

            <!-- Functions Row 2 -->
            <button class="func" data-action="log">log</button>
            <button class="func" data-action="ln">ln</button>
            <button class="operator">(</button>
            <button class="operator">)</button>
            <button class="operator">/</button>

            <!-- Functions Row 3 -->
            <button class="func" data-action="sqrt">√</button>
            <button class="operator" data-action="pow">x^y</button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>

            <!-- Operators & Row 4 -->
            <button class="func" data-action="square">x²</button>
            <button class="operator">*</button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>

            <!-- Row 5 -->
            <button class="constant" data-value="3.14159265359">π</button>
            <button class="operator">-</button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>

            <!-- Row 6 -->
            <button class="constant" data-value="2.71828182846">e</button>
            <button class="operator">+</button>
            <button class="number">0</button>
            <button class="decimal">.</button>
            <button class="equal">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
